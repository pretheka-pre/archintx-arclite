services:
  # Backend Web Service
  - type: web
    name: arclite-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arclite-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@archintx.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://archintx-arclite.vercel.app

databases:
  # Managed PostgreSQL
  - name: arclite-db
    databaseName: arclite
    user: arclite_admin
